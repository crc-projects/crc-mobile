name: API contract

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  generated-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: python -m pip install -r tools/requirements.txt
      - run: npx --yes @redocly/cli@2.65.0 lint openapi.yaml --extends=spec
      - run: python tools/generate_api.py --check
      - run: dotnet build generated/Crc.Mobile.Api.csproj --configuration Release
